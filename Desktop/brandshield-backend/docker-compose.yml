services:
  postgres:
    image: postgres:18-alpine
    container_name: brandshield-postgres
    environment:
      POSTGRES_DB: brandshield_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nayan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: brandshield-backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brandshield_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Nayan
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
